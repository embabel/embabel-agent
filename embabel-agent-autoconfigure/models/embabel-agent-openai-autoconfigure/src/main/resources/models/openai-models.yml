# ============================================
# openai-models.yml
# ============================================
# OpenAI and compatible models configuration
# Model IDs verified against GET /v1/models on 2026-03-29; the GPT-5.5 and
# GPT-5.6 families against developers.openai.com/api/docs/models on 2026-08-04,
# the GPT-6 family on 2026-10-05.
# Pricing verified against official OpenAI model pages and openai.com/api/pricing
# on 2026-04-02, for GPT-5.5/5.6 on 2026-08-04, and for GPT-6/5.6 on 2026-10-05.
# Lifecycle per developers.openai.com/api/docs/deprecations on 2026-10-05.
# Note: undated aliases (e.g. "gpt-5.4") resolve to OpenAI's current recommended
#       pinned version and may change over time. Use dated model IDs in the
#       OpenAiModels constants if reproducibility is required.
# Note: cached_input pricing is intentionally omitted — PerTokenPricingModel
#       only supports usd_per1m_input_tokens and usd_per1m_output_tokens.

native_support_defaults:
  structured_output:
    # Default native structured-output metadata for OpenAI models.
    # The tag names under options are documentation-only for now; the current
    # configurer still uses Spring AI option objects for payload mutation.
    supported: true
    strategy: "response_format"
    strict: false
    prompt_instructions: "include"
    options:
      # Documentation only for now.
      response_format_field: "response_format"
      # Documentation only for now.
      type_field: "type"
      # Documentation only for now.
      type_value: "json_schema"
      # Documentation only for now.
      json_schema_field: "json_schema"
      # Documentation only for now.
      name_field: "name"
      # Documentation only for now.
      schema_field: "schema"
      # Documentation only for now.
      strict_field: "strict"

models:
  # ========================================
  # GPT-6 FAMILY (Current Flagship)
  # Model pages and pricing verified: developers.openai.com 2026-10-05
  # Astra is the flagship, 6.1 Sol balances intelligence and cost, Luna is
  # the high-volume tier. GPT-6 Sol is the previous Sol, superseded by 6.1 Sol.
  # Prices are the short-context tier (<272K); long context is billed higher.
  #
  # Same transport constraint as GPT-5.6: Astra and 6.1 Sol take tool calls
  # only over Responses, and 6 Sol and Luna accept function tools on Chat
  # Completions only at reasoning effort `none`. All four are pinned to
  # Responses for the reason given under GPT-5.6 below.
  # ========================================

  - name: "gpt6astra"
    model_id: "gpt-6-astra"
    api_format: "RESPONSES"
    display_name: "GPT-6 Astra"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 10.00
      usd_per1m_output_tokens: 50.00
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  - name: "gpt61sol"
    model_id: "gpt-6.1-sol"
    api_format: "RESPONSES"
    display_name: "GPT-6.1 Sol"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 2.00
      usd_per1m_output_tokens: 10.00
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  - name: "gpt6sol"
    model_id: "gpt-6-sol"
    api_format: "RESPONSES"
    display_name: "GPT-6 Sol"
    max_tokens: 16384
