# ============================================
# openai-models.yml
# ============================================
# OpenAI and compatible models configuration
# Model IDs verified against GET /v1/models on 2026-03-29; the GPT-5.5 and
# GPT-5.6 families against developers.openai.com/api/docs/models on 2026-08-04.
# Pricing verified against official OpenAI model pages and openai.com/api/pricing
# on 2026-04-02, and for GPT-5.5/5.6 on 2026-08-04.
# Note: undated aliases (e.g. "gpt-5.4") resolve to OpenAI's current recommended
#       pinned version and may change over time. Use dated model IDs in the
#       OpenAiModels constants if reproducibility is required.
# Note: cached_input pricing is intentionally omitted — PerTokenPricingModel
#       only supports usd_per1m_input_tokens and usd_per1m_output_tokens.

native_support_defaults:
  structured_output:
    # Default native structured-output metadata for OpenAI models.
    # The tag names under options are documentation-only for now; the current
    # configurer still uses Spring AI option objects for payload mutation.
    supported: true
    strategy: "response_format"
    strict: false
    prompt_instructions: "include"
    options:
      # Documentation only for now.
      response_format_field: "response_format"
      # Documentation only for now.
      type_field: "type"
      # Documentation only for now.
      type_value: "json_schema"
      # Documentation only for now.
      json_schema_field: "json_schema"
      # Documentation only for now.
      name_field: "name"
      # Documentation only for now.
      schema_field: "schema"
      # Documentation only for now.
      strict_field: "strict"

models:
  # ========================================
  # GPT-5.6 FAMILY (Current Flagship - July 2026)
  # Model pages and pricing verified: developers.openai.com 2026-08-04
  # Tiers are Luna/Terra/Sol, not nano/mini/pro: "pro" became a Responses-only
  # reasoning MODE (reasoning.mode) rather than a model.
  # The "gpt-5.6" alias routes to Sol; the tiers are registered by their own ids.
  # Prices are the short-context tier (<272K); long context is billed higher.
  #
  # All three answer a plain prompt over either endpoint, but Chat Completions
  # refuses any request carrying function tools:
  #   400: Function tools with reasoning_effort are not supported for
  #        gpt-5.6-luna in /v1/chat/completions.
  # These models default to `medium` reasoning effort server-side when the
  # request omits it, which every Embabel request does, so the combination is
  # unavoidable there. Chat Completions would take tools only at effort `none`
  # — not something to impose on models bought for their reasoning. Responses
  # accepts every effort level alongside tools, and is the endpoint OpenAI
  # documents for tool-calling workflows, so all three are pinned to it.
  # ========================================

  - name: "gpt56sol"
    model_id: "gpt-5.6-sol"
    api_format: "RESPONSES"
    display_name: "GPT-5.6 Sol"
    max_tokens: 16384
    temperature: 1.0
    pricing_model:
      usd_per1m_input_tokens: 5.00
      usd_per1m_output_tokens: 30.00
    special_handling:
      supports_temperature: false
      supports_top_p: false
      supports_frequency_penalty: false
      supports_presence_penalty: false
      uses_max_completion_tokens: true

  - name: "gpt56terra"
