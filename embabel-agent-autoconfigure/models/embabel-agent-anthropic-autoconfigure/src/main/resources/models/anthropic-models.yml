# ============================================
# anthropic-models.yml
# ============================================
# Updated with latest Anthropic models as of October 5, 2026
# Using official Anthropic API aliases
# IDs, prices and lifecycle verified 2026-10-05 against
# platform.claude.com/docs/en/about-claude/models/overview, /pricing and
# /model-deprecations.

native_support_defaults:
  structured_output:
    # Default native structured-output metadata for Anthropic models.
    # The tag names under options are documentation-only for now; the current
    # configurer still uses Spring AI option objects for payload mutation.
    # Native structured output is disabled by default until Anthropic behavior
    # is verified end-to-end for the supported shapes we care about.
    supported: false
    strategy: "tool"
    strict: true
    prompt_instructions: "include"
    options:
      # Documentation only for now.
      tools_field: "tools"
      # Documentation only for now.
      tool_name_field: "name"
      # Documentation only for now.
      tool_description_field: "description"
      # Documentation only for now.
      input_schema_field: "input_schema"

models:
  # ========================================
  # CLAUDE 5 GENERATION
  # 1M context, 128K max output. Thinking is adaptive and cannot be turned
  # off on Opus 5.5 and Fable 5.1; Sonnet 5.5 also rejects "disabled".
  # ========================================

  # Claude Fable 5.1 - Demanding reasoning and long-horizon agentic work
  # Forced tool use (tool_choice any/tool) returns an error on this model.
  - name: "claude_fable_51"
    model_id: "claude-fable-5-1"
    display_name: "Claude Fable 5.1"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 10.0
      usd_per1m_output_tokens: 50.0

  # Claude Opus 5.5 - Long-running agentic coding and knowledge work
  - name: "claude_opus_55"
    model_id: "claude-opus-5-5"
    display_name: "Claude Opus 5.5"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
