# ============================================
# anthropic-models.yml
# ============================================
# Updated with latest Anthropic models as of October 20, 2026
# Using official Anthropic API aliases
# IDs, prices and lifecycle verified 2026-10-05 (Haiku 5.5: 2026-10-20) against
# platform.claude.com/docs/en/about-claude/models/overview, /pricing and
# /model-deprecations.
# Cache rates verified 2026-10-29 against /pricing: cache_read is "cache hits and
# refreshes", cache_write is the 5-minute TTL write. 1-hour TTL writes cost 2x input;
# override usd_per1m_cache_write_input_tokens when a deployment uses them.

native_support_defaults:
  structured_output:
    # Default native structured-output metadata for Anthropic models.
    # The tag names under options are documentation-only for now; the current
    # configurer still uses Spring AI option objects for payload mutation.
    # Native structured output is disabled by default until Anthropic behavior
    # is verified end-to-end for the supported shapes we care about.
    supported: false
    strategy: "tool"
    strict: true
    prompt_instructions: "include"
    options:
      # Documentation only for now.
      tools_field: "tools"
      # Documentation only for now.
      tool_name_field: "name"
      # Documentation only for now.
      tool_description_field: "description"
      # Documentation only for now.
      input_schema_field: "input_schema"

models:
  # ========================================
  # CLAUDE 5 GENERATION
  # 1M context, 128K max output. Thinking is adaptive and cannot be turned
  # off on Opus 5.5 and Fable 5.1; Sonnet 5.5 also rejects "disabled".
  # Haiku 5.5 accepts "disabled" only at effort high or below.
  # ========================================

  # Claude Fable 5.1 - Demanding reasoning and long-horizon agentic work
  # Forced tool use (tool_choice any/tool) returns an error on this model.
  - name: "claude_fable_51"
    model_id: "claude-fable-5-1"
    display_name: "Claude Fable 5.1"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 10.0
      usd_per1m_output_tokens: 50.0
      usd_per1m_cache_read_input_tokens: 0.25
      usd_per1m_cache_write_input_tokens: 12.5

  # Claude Opus 5.5 - Long-running agentic coding and knowledge work
  - name: "claude_opus_55"
    model_id: "claude-opus-5-5"
    display_name: "Claude Opus 5.5"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 4.0
      usd_per1m_output_tokens: 20.0
      usd_per1m_cache_read_input_tokens: 0.20
      usd_per1m_cache_write_input_tokens: 5.0

  # Claude Sonnet 5.5 - Best combination of speed and intelligence
  - name: "claude_sonnet_55"
    model_id: "claude-sonnet-5-5"
    display_name: "Claude Sonnet 5.5"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 2.0
      usd_per1m_output_tokens: 10.0
      usd_per1m_cache_read_input_tokens: 0.10
      usd_per1m_cache_write_input_tokens: 2.5

  # Claude Haiku 5.5 - High-volume, latency-sensitive tasks (classification,
  # extraction, routing). Priced by prompt length: the rates below apply to
  # prompts up to 100K tokens; prompts over 100K pay $0.50 / $2.50 per 1M
  # ($0.05 cache read, $0.625 cache write).
  - name: "claude_haiku_55"
    model_id: "claude-haiku-5-5"
    display_name: "Claude Haiku 5.5"
    knowledge_cutoff_date: "2026-06-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 0.10
      usd_per1m_output_tokens: 0.50
      usd_per1m_cache_read_input_tokens: 0.01
      usd_per1m_cache_write_input_tokens: 0.125

  # ========================================
  # CLAUDE 4.8 FAMILY
  # ========================================

  # Claude Opus 4.8 - Previous flagship, 1M context
  - name: "claude_opus_48"
    model_id: "claude-opus-4-8"
    display_name: "Claude Opus 4.8"
    # Reliable knowledge cutoff per Anthropic models overview (Jan 2026)
    knowledge_cutoff_date: "2026-01-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 5.0
      usd_per1m_output_tokens: 25.0
      usd_per1m_cache_read_input_tokens: 0.50
      usd_per1m_cache_write_input_tokens: 6.25

  # ========================================
  # CLAUDE 4.6 FAMILY
  # ========================================

  # Claude Opus 4.6 - 1M context, best reasoning & coding
  - name: "claude_opus_46"
    model_id: "claude-opus-4-6"
    display_name: "Claude Opus 4.6"
    knowledge_cutoff_date: "2025-10-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 5.0
      usd_per1m_output_tokens: 25.0
      usd_per1m_cache_read_input_tokens: 0.50
      usd_per1m_cache_write_input_tokens: 6.25

  # Claude Sonnet 4.6 - Best balance of cost/performance, 1M context
  - name: "claude_sonnet_46"
    model_id: "claude-sonnet-4-6"
    display_name: "Claude Sonnet 4.6"
    knowledge_cutoff_date: "2025-10-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 3.0
      usd_per1m_output_tokens: 15.0
      usd_per1m_cache_read_input_tokens: 0.30
      usd_per1m_cache_write_input_tokens: 3.75
  # ========================================
  # CLAUDE 4.5 FAMILY (Previous Generation)
  # ========================================

  # Claude Sonnet 4.5 - Strong coding & agent capabilities
  # Deprecated: retires 2026-11-30 (replacement claude-sonnet-5-5).
  - name: "claude_sonnet_45"
    model_id: "claude-sonnet-4-5"
    display_name: "Claude Sonnet 4.5"
    knowledge_cutoff_date: "2025-01-01"
    max_tokens: 8192
    pricing_model:
      usd_per1m_input_tokens: 3.0
      usd_per1m_output_tokens: 15.0
      usd_per1m_cache_read_input_tokens: 0.30
      usd_per1m_cache_write_input_tokens: 3.75
  # Claude Haiku 4.5 - Fast, cost-efficient with near-frontier performance
  - name: "claude_haiku_45"
