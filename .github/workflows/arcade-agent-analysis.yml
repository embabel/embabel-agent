name: Arcade Architecture Analysis

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arcade-agent with language extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "arcade-agent[languages]==0.2.0"

      # 0.2.0 has --language only (no --languages). Auto-detect picks Kotlin as the
      # dominant JVM language; upgrade arcade-agent for explicit java+kotlin polyglot.
      - name: Run PKG architecture analysis
        run: |
          arcade-self-analysis \
            --source . \
            --repo-name embabel-agent \
            --algorithm pkg \
            --output-json arcade_analysis_results.json \
            --output-html arcade_analysis_report.html

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcade-agent-analysis
          path: |
            arcade_analysis_results.json
            arcade_analysis_report.html
